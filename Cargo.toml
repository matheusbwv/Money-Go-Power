[package]
name = "minhas-financas"
version = "1.0.0"
edition = "2021"
description = "Controle das contas e faturas de cartão do mês"
default-run = "MinhasFinancas"

[[bin]]
name = "MinhasFinancas"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "custom-protocol" embute a interface (pasta ui/) dentro do .exe
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
codegen-units = 4
