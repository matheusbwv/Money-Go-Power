# Publica uma versão nova quando uma tag "v..." é enviada (ex.: git push origin v1.0.0)
# ou pelo botão "Run workflow" na aba Actions (usa a versão do Cargo.toml):
# roda os testes, compila o MinhasFinancas.exe no Windows e cria a release com o .exe anexado.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes
        run: cargo test --release --locked

      - name: Compilar
        run: cargo build --release --locked

      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = 'v' + (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          }
          $exe = 'target/release/MinhasFinancas.exe'
          $notas = '.github/notas-da-versao.md'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # a release desta versão já existe: troca o .exe e o texto
            gh release upload $tag $exe --clobber
            gh release edit $tag --notes-file $notas
          } else {
            gh release create $tag $exe --title "Money Go Power $tag" --notes-file $notas --target $env:GITHUB_SHA
          }
